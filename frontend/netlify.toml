# Netlify config cho FE umi 3.5 (SPA). Đặt ở thư mục gốc của frontend.
#
# TÁCH THẬT 2 BUILD từ cùng codebase — phân biệt bằng env APP_CONFIG_TARGET:
#   - Site Landing  (lunaspa.vn):        APP_CONFIG_TARGET=landing  → bundle chỉ có trang khách.
#   - Site Quản lý  (admin.lunaspa.vn):  APP_CONFIG_TARGET=admin    → bundle đầy đủ (login + quản lý).
# Set APP_CONFIG_TARGET ở UI mỗi site (Site settings → Environment variables), KHÔNG cố định ở đây.
# Build command dùng chung `umi build`; routes.ts tự chọn tập route theo env.

[build]
  command = "umi build"
  publish = "dist"
  # Nếu repo Git có frontend là thư mục con, mở dòng dưới và sửa cho đúng:
  # base = "frontend"

[build.environment]
  # umi 3.5 build ổn định trên Node 16 (Node 18+ dễ lỗi OpenSSL3).
  NODE_VERSION = "16"
  # Các biến set ở UI mỗi site (Site settings → Environment variables):
  #   APP_CONFIG_TARGET  = landing | admin   (BẮT BUỘC — quyết định bundle nào)
  #   APP_CONFIG_API_URL = https://api.lunaspa.vn/api/v1   (URL BE công khai)

# SPA fallback — route động :id + browser history cần rewrite về index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
